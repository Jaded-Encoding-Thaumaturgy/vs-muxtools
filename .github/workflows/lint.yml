name: Lint
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      PYTHON_VER: "3.15"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VER }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run vsstubs
        run: uv run --no-sync vsstubs

      - name: Run ruff check (Python ${{ env.PYTHON_VER }})
        run: uv run --no-sync ruff check ./vsmuxtools/

      - name: Run Pyrefly (Python ${{ env.PYTHON_VER }})
        run: uv run --no-sync pyrefly check

      - name: Run ruff format (Python ${{ env.PYTHON_VER }})
        run: uv run --no-sync ruff format --check ./vsmuxtools/

      - name: Post webhook for failure
        if: failure() && github.event_name != 'pull_request'
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
